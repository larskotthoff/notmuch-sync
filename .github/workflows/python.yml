# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-test:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        sudo apt-get install -y notmuch libnotmuch-dev libxapian-dev
        python -m pip install --upgrade pip
        pip install flake8 pytest mypy
        # notmuch2 PyPI sdist is missing version.txt (upstream packaging bug); download and patch before installing
        tmpdir=$(mktemp -d)
        NM2_URL=$(curl -s https://pypi.org/pypi/notmuch2/json | python3 -c "import sys,json; d=json.load(sys.stdin); v=d['info']['version']; [print(f['url']) for f in d['releases'][v] if f['packagetype']=='sdist']")
        curl -sL "$NM2_URL" -o "$tmpdir/notmuch2.tar.gz"
        tar -xzf "$tmpdir/notmuch2.tar.gz" -C "$tmpdir"
        NM2_VER=$(ls "$tmpdir" | grep '^notmuch2-' | head -1 | sed 's/^notmuch2-//')
        echo "$NM2_VER" > "$tmpdir/notmuch2-${NM2_VER}/version.txt"
        pip install --no-build-isolation "$tmpdir/notmuch2-${NM2_VER}/"
        grep -v '^notmuch2' requirements.txt | pip install -r /dev/stdin
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Type check
      run: |
        mypy --follow-untyped-imports src/notmuch_sync.py
    - name: Test with pytest
      run: |
        pytest test/*.py
